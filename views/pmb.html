{% extends "main.html" %}{% block content %}
<form action="/pmb" method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="nama" class="form-label">Nama</label>
    <input type="text" class="form-control" id="nama" name="nama" />
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" />
  </div>
  <div class="mb-3">
    <label for="tempat_lahir" class="form-label">Tempat Lahir</label>
    <input type="text" class="form-control" id="tempat_lahir" name="tempat_lahir" />
  </div>
  <div class="mb-3">
    <label for="tanggal_lahir" class="form-label">Tanggal Lahir</label>
    <input type="date" class="form-control" id="tanggal_lahir" name="tanggal_lahir" />
  </div>
  <div class="mb-3">
    <label for="asal_sma" class="form-label">Asal SMA</label>
    <input type="text" class="form-control" id="asal_sma" name="asal_sma" />
  </div>
  <div class="mb-3">
    <label for="nomor" class="form-label">No. HP</label>
    <input type="text" class="form-control" id="nomor" name="nomor" />
  </div>
  <div class="mb-3">
    <label for="foto" class="form-label">Upload Foto</label>
    <input type="file" class="form-control" id="foto" name="foto" />
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}
